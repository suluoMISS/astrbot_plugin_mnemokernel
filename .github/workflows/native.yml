name: Native kernel

on:
  workflow_dispatch:
  push:
    paths:
      - "rust/**"
      - "rust-toolchain.toml"
      - "migrations/**"
      - "schemas/**"
      - "scripts/smoke_native_wheel.py"
      - ".github/workflows/native.yml"
  pull_request:
    paths:
      - "rust/**"
      - "rust-toolchain.toml"
      - "migrations/**"
      - "schemas/**"
      - "scripts/smoke_native_wheel.py"
      - ".github/workflows/native.yml"

permissions:
  contents: read

env:
  PYO3_BUILD_EXTENSION_MODULE: "1"

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install pinned Rust toolchain
        run: rustup toolchain install 1.97.1 --profile minimal --component clippy,rustfmt
      - name: Select pinned Rust toolchain
        run: rustup override set 1.97.1
      - name: Rust formatting
        working-directory: rust
        run: cargo fmt --all -- --check
      - name: Rust tests
        working-directory: rust
        run: cargo test --workspace --locked
      - name: Rust clippy
        working-directory: rust
        run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - name: Python tests
        run: python -m unittest discover -s tests -v

  wheel:
    needs: quality
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ["3.10", "3.12", "3.14"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Install pinned Rust toolchain
        run: rustup toolchain install 1.97.1 --profile minimal
      - name: Select pinned Rust toolchain
        run: rustup override set 1.97.1
      - name: Install Maturin
        run: python -m pip install "maturin==1.14.1"
      - name: Build abi3 wheel
        working-directory: rust/crates/mnemokernel-py
        run: maturin build --release --locked --out ../../../dist/native
      - name: Install and smoke-test wheel
        run: python scripts/smoke_native_wheel.py dist/native
      - uses: actions/upload-artifact@v4
        with:
          name: mnemokernel-native-${{ matrix.os }}-py${{ matrix.python }}
          path: dist/native/*.whl
          if-no-files-found: error

