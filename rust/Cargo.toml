[workspace]
members = [
    "crates/mnemokernel-core",
    "crates/mnemokernel-store",
    "crates/mnemokernel-py",
]
resolver = "2"

[workspace.package]
version = "0.1.0-alpha.4"
edition = "2024"
license = "AGPL-3.0-or-later"

[workspace.dependencies]
hex = "0.4"
pyo3 = "0.29"
regex = "1"
rusqlite = { version = "0.37", features = ["bundled", "backup"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
thiserror = "2"

[profile.release]
lto = "thin"
codegen-units = 1
strip = "symbols"
